<section>
    <h2>Formulário de Voluntariado</h2>
    <p>Preencha os dados abaixo para se juntar à nossa causa.</p>
    
    <form action="#" method="POST" id="form-cadastro">
        
        <fieldset>
            <legend>Dados Pessoais</legend>
            
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome" required placeholder=" ">
            <br><br>

            <label for="nascimento">Data de Nascimento:</label>
            <input type="date" id="nascimento" name="nascimento" required placeholder=" ">
            <br><br>

            <label for="cpf">CPF (Ex: 123.456.789-00):</label>
            <input type="text" id="cpf" name="cpf" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" title="Digite no formato 000.000.000-00" maxlength="14" required placeholder=" ">
        </fieldset>
        <br>

        <fieldset>
            <legend>Contato e Endereço</legend>
            
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required placeholder=" ">
            <br><br>

            <label for="telefone">Telefone (Ex: (11) 98765-4321):</label>
            <input type="tel" id="telefone" name="telefone" pattern="\(\d{2}\)\s\d{4,5}-\d{4}" title="Digite no formato (00) 00000-0000" maxlength="15" required placeholder=" ">
            <br><br>

            <label for="endereco">Endereço Completo:</label>
            <input type="text" id="endereco" name="endereco" required placeholder=" ">
            <br><br>

            <label for="cidade">Cidade:</label>
            <input type="text" id="cidade" name="cidade" required placeholder=" ">

            <label for="estado">Estado:</label>
            <input type="text" id="estado" name="estado" maxlength="2" required placeholder=" ">
            <br><br>

            <label for="cep">CEP (Ex: 01000-000):</label>
            <input type="text" id="cep" name="cep" pattern="\d{5}-\d{3}" title="Digite o CEP no formato 00000-000" maxlength="9" required placeholder=" ">
        </fieldset>
        <br>

        <button type="submit">Enviar Cadastro</button>
    </form>
</section>
